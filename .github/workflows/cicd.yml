name: cicd

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LOCAL_DYNAMO_ENDPOINT: "http://dynamodb:8000"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  # Type-checks and executes every docs example (www/src/examples/**)
  # against this branch's ElectroDB, including expected-error assertions
  # declared in each example's expect.json. Runs unconditionally (unlike
  # the path-filtered docs workflow) so it can serve as a required check
  # on every PR. Node 24: scripts/test-examples.ts runs via native type
  # stripping (Node >= 23.6).
  docs-examples:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install library dependencies
        run: npm ci --omit=dev
      - name: Install docs dependencies
        run: npm ci
        working-directory: www
      - name: Type-check and execute docs examples
        run: npm run test:examples
        working-directory: www
